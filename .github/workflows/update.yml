name: Stats aktualisieren

on:
  schedule:
    - cron: '17 * * * *'   # stündlich (Minute 17, um die volle Stunde zu meiden)
  workflow_dispatch:        # manuell über den "Run workflow"-Button
  push:
    branches: [main]
    paths: ['public/**', 'src/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Logs holen und Statistiken berechnen
        run: node scripts/build.js

      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/stats.json public/emotes public/index.html
          git diff --staged --quiet || (git commit -m "Daten aktualisieren" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
