name: Stats aktualisieren

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # alle 15 Minuten (nicht zur vollen Stunde, da ist GitHub überlastet)
  workflow_dispatch:                # manuell über den "Run workflow"-Button
  push:
    branches: [main]
    paths: ['public/**', 'src/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read
  actions: write      # alte Caches löschen
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Zwischenstand (Tageszahlen inkl. aller Chatter) liegt nur im Cache, nicht im öffentlichen Repo
      - name: Zwischenstand laden
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Neue Logs holen und Statistiken berechnen
        run: node scripts/build.js

      - name: Zwischenstand speichern
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ github.run_id }}

      - name: Alte Zwischenstände löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key state- --limit 100 --json id,key \
            --jq '.[] | select(.key != "state-${{ github.run_id }}") | .id' \
            | xargs -r -n1 gh cache delete || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
